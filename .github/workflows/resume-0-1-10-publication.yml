name: Resume verified FutCall 0.1.10 publication
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-futcall-0-1-10
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Transfer verified installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'RELEASE_JS'
          const {execFileSync}=require('node:child_process');
          const {readFileSync,mkdirSync}=require('node:fs');
          const {createHash}=require('node:crypto');
          const expected={"FutCall_0.1.10_aarch64.app.tar.gz":"sha256:ab9f48b536c8793cc504196392e2a0f12f6dc1a27d34c4e4e46ec79e3e4dcf01","FutCall_0.1.10_aarch64.app.tar.gz.sig":"sha256:7f2f67d9f3d2c46629af81f9f0155a1db100610a66f6eed8bb0c8876eef620bd","FutCall_0.1.10_aarch64.dmg":"sha256:e3ff9553f3bf6250388094689a5bf7c830ea4405b268a32b98d42b8cada32206","FutCall_0.1.10_x64-setup.exe":"sha256:a328ba41df76d16a7e8dbe940a122a8f2551b43258dbffd901c552b85f993758","FutCall_0.1.10_x64-setup.exe.sig":"sha256:6924df6fd245e8fd83de20f2d009423e63eee76f40858ed1d4328294fa97e4f5","FutCall_0.1.10_x64.dmg":"sha256:45ecafaf2a7a59e5537c1c868bf07a00c0ada0f74804cc974587fde5a9b6d5a3","FutCall_0.1.10_x64_en-US.msi":"sha256:7711d9d3add81f358d70c7446c472f37ee21a244e9b9910a5a7704fabc86fae1","FutCall_0.1.10_x64_en-US.msi.sig":"sha256:e0c46a4a1d0ab5b1425932763ac4e72846a8bc0ec1338e56897162f23f0d37ee","FutCall_0.1.10_x86_64.app.tar.gz":"sha256:f2e8a4a12777cb6c9aa939d4d22fb3cff863bb720e41b9af5894370c1bfd2646","FutCall_0.1.10_x86_64.app.tar.gz.sig":"sha256:e1c71c0c3cf09777c8e2a04a29e5dae42666e0ac0a5ea6a6bba2963be20203a9","SHA256SUMS.txt":"sha256:c15b8b533fd771c8485cfc4566e8626c36aac0daa20b7658b6bb16cf8f874c82","latest.json":"sha256:c1d66b0cf63b9d009176768b01175eca5ead8618d62ef1e2b46617eb55e23017","release-notes.md":"sha256:63be0b8eb6875e3d54519e15e25a12915e53fa03af069d9cefb82457494fd3fd"};
          const repo='quentinvdlpro/FutCall-releases',ep='repos/'+repo+'/releases/416364207';
          function gh(args,json=true){const s=execFileSync('gh',args,{encoding:'utf8',maxBuffer:16000000});return json?JSON.parse(s):s;}
          let release=gh(['api',ep]);
          if(release.tag_name!=='v0.1.10'||release.prerelease)throw Error('Unexpected release');
          const candidate=gh(['release','view','candidate-v0.1.10-e554e4364223','--repo',repo,'--json','assets']);
          mkdirSync('verified');
          for(const [name,digest] of Object.entries(expected)){
           const current=release.assets.find(a=>a.name===name);
           if(current){if(current.state!=='uploaded'||current.digest!==digest)throw Error('Existing asset mismatch '+name);continue;}
           if(!release.draft)throw Error('Published release is incomplete');
           const source=candidate.assets.find(a=>a.name===name);
           if(!source||source.digest!==digest)throw Error('Source asset mismatch '+name);
           gh(['release','download','candidate-v0.1.10-e554e4364223','--repo',repo,'--pattern',name,'--dir','verified'],false);
           if('sha256:'+createHash('sha256').update(readFileSync('verified/'+name)).digest('hex')!==digest)throw Error('Downloaded checksum mismatch');
           gh(['release','upload','v0.1.10','--repo',repo,'verified/'+name],false);
           console.log('Transferred and verified '+name);
           release=gh(['api',ep]);
          }
          release=gh(['api',ep]);
          if(release.assets.length!==Object.keys(expected).length||release.assets.some(a=>a.state!=='uploaded'||a.digest!==expected[a.name]))throw Error('Final asset verification failed');
          const manifest=gh(['api','repos/'+repo+'/releases/assets/'+release.assets.find(a=>a.name==='latest.json').id,'-H','Accept: application/octet-stream']);
          if(manifest.version!=='0.1.10')throw Error('Unexpected update version');
          gh(['api',ep,'--method','PATCH','-F','draft=false','-f','make_latest=true']);
          release=gh(['api',ep]);const latest=gh(['api','repos/'+repo+'/releases/latest']);
          if(release.draft||latest.id!==release.id)throw Error('Publication not confirmed');
          console.log('Published '+release.html_url);
          
          RELEASE_JS
